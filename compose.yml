# Local resolver pipeline: client -> resolvers (BIND, Knot, PowerDNS) -> responder on a private bridge.
# Start with docker/pipeline.sh up (prepares log dirs), not plain `docker compose up`.

x-bind-image: &bind-image
  # BIND 9.20.29 (pulled 2026-10-13); ISC only publishes moving branch tags.
  internetsystemsconsortium/bind9@sha256:071465f88068854d0ceadd9b985fb1acae4071e80754e545cd811fde57541ad0

networks:
  lab:
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  responder:
    build:
      context: .
      dockerfile: docker/responder.Dockerfile
    # Host uid so files written to the mounts stay yours. Docker lets
    # unprivileged users bind port 53 inside containers.
    user: "${UID:-1000}:${GID:-1000}"
    init: true
    volumes:
      - ./zones:/app/zones
      - ./logs:/app/logs
    networks:
      lab:
        ipv4_address: 172.30.0.10

  bind:
    image: *bind-image
    depends_on: [responder]
    # Create the rndc key (used by `rndc` inside this container), then run
    # named exactly as the image's default entrypoint/cmd would.
    entrypoint:
      - sh
      - -c
      - rndc-confgen -a -u bind && exec /usr/sbin/named -u bind -f -c /etc/bind/named.conf
    volumes:
      - ./docker/bind/named.conf:/etc/bind/named.conf:ro
      - ./zones:/etc/bind/zones:ro       # trust anchors (*.anchor)
      - ./logs/bind:/var/log/bind
    networks:
      lab:
        ipv4_address: 172.30.0.20

  knot:
    # Knot Resolver v6.5.0 (package 6.5.0.dev1+928fe2-cznic.1), pulled 2026-10-15.
    image: cznic/knot-resolver@sha256:b2422a58c6b6ab863f24f9e80f65677ae45dcbe0ed9474ced8cb32453f5c49e0
    depends_on: [responder]
    volumes:
      - ./docker/knot/config.yaml:/etc/knot-resolver/config.yaml:ro
      - ./zones:/etc/knot-resolver/zones:ro      # trust anchors (*.dnskey)
    networks:
      lab:
        ipv4_address: 172.30.0.21

  pdns:
    # PowerDNS Recursor 5.4.7, pulled 2026-10-15.
    image: powerdns/pdns-recursor-54@sha256:ec0ad7d67b63e7e31a5847f0a7dd06f43ab0633dc3318e9a7dca7beda84deff8
    depends_on: [responder]
    volumes:
      - ./docker/pdns/recursor.yml:/etc/powerdns/recursor.yml:ro
      - ./docker/pdns/recursor.d:/etc/powerdns/recursor.d:ro   # anchors.yml (generated)
    networks:
      lab:
        ipv4_address: 172.30.0.22

  client:
    image: *bind-image   # only for its dig
    init: true
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      lab:
        ipv4_address: 172.30.0.30
