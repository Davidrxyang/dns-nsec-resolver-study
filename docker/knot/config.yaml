# Knot Resolver 6 in the local pipeline:
#   client -> knot (172.30.0.21) -> local root (172.30.0.11) -> responder (172.30.0.10).
# Zones are reached by ordinary delegation from the lab's signed root (FINDINGS INFRA.8).
# Image: cznic/knot-resolver v6.5.0 (package 6.5.0.dev1+928fe2-cznic.1), pinned by digest in compose.yml.

workers: 2                        # the image's default

network:
  listen:
    - interface: 172.30.0.21      # the container's lab address (not 0.0.0.0, per the docs' warning)
    - interface: 127.0.0.1

# Only the lab network may query (no ports are published, but be explicit).
views:
  - subnets: [ 0.0.0.0/0, "::/0" ]
    answer: refused
  - subnets: [ 172.30.0.0/24, 127.0.0.1 ]
    answer: allow

# The lab root's key (converted by docker/pipeline.sh up); read-only: no RFC 5011 updates.
dnssec:
  trust-anchors-files:
    - { file: /etc/knot-resolver/zones/root/root.dnskey, read-only: true }

logging:
  level: info

# Root hints: Knot 6's YAML has no root-hints option, so use its Lua escape hatch
# (appended to the generated config; checked with `kresctl convert`).
lua:
  script: |
    modules.load('hints > iterate')   -- not loaded by default in Knot 6
    hints.root({['a.root.lab.'] = '172.30.0.11'})
    -- Knot answers special-use names (RFC 6761) itself: every .test name got a
    -- local empty-zone NXDOMAIN (SOA localhost. nobody.invalid.) with AD set.
    -- PASS lets .test resolve normally, through the lab root.
    -- Lab-only (FINDINGS ALL.9, INFRA.8): not needed for a real domain.
    policy.add(policy.suffix(policy.PASS, policy.todnames({'test.'})))
