# Unbound 1.26.1 in the local pipeline:
#   client -> unbound (172.30.0.23) -> local root (172.30.0.11) -> responder (172.30.0.10).
# Zones are reached by ordinary delegation from the lab's signed root (FINDINGS INFRA.8).
server:
  interface: 172.30.0.23
  interface: 127.0.0.1
  access-control: 172.30.0.0/24 allow
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  chroot: ""                  # the default is a chroot directory; not wanted in a container
  username: "unbound"
  use-syslog: no
  logfile: ""                 # stderr: `docker compose logs unbound`
  verbosity: 1
  log-queries: yes
  log-replies: yes
  log-servfail: yes
  val-log-level: 2            # print why validation failed

  # Lab root: hints and its key as the only trust anchor (static, no RFC 5011).
  root-hints: "/etc/unbound/root.hints"
  trust-anchor-file: "/etc/unbound/zones/root/root.dnskey"
  # Unbound serves test. as a default local zone (RFC 6761), so without this it
  # would answer every .test name itself. Lab-only (FINDINGS ALL.9, INFRA.8).
  local-zone: "test." nodefault

  # Defaults, written out so the config records them:
  aggressive-nsec: yes        # RFC 8198
  harden-below-nxdomain: yes  # RFC 8020
  qname-minimisation: yes     # relaxed (qname-minimisation-strict: no)
  use-caps-for-id: no         # no 0x20 case randomization
  trust-anchor-signaling: yes # RFC 8145 _ta- queries (the harness ignores them)

remote-control:
  control-enable: yes
  control-interface: 127.0.0.1
  control-use-cert: no        # allowed for a localhost control interface
