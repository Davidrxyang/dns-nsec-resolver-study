// BIND 9.20 as a validating recursive resolver for the local pipeline:
// client (172.30.0.30) -> BIND (172.30.0.20) -> local root (172.30.0.11) -> responder (172.30.0.10).
// Zones are reached by ordinary delegation from the lab's signed root (FINDINGS INFRA.8).
// Defaults are kept unless the study needs a setting pinned or observed.

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };

    recursion yes;
    // Only the lab network; no ports are published, so nothing outside reaches it.
    allow-query { 172.30.0.0/24; 127.0.0.1; };
    allow-recursion { 172.30.0.0/24; 127.0.0.1; };

    dnssec-validation yes;      // only the configured anchor (the lab root), not BIND's built-in root key
    synth-from-dnssec yes;      // RFC 8198 ANC (the default; pinned for clarity)

    querylog yes;
    dump-file "/var/log/bind/named_dump.db";    // rndc dumpdb -cache
    dnstap { client; resolver; };
    dnstap-output file "/var/log/bind/dnstap.fstrm";
};

// The lab root's key, written by docker/pipeline.sh up; the only trust anchor.
include "/etc/bind/zones/root/root.anchor";

// Root hints: the lab root instead of the Internet's.
zone "." {
    type hint;
    file "/etc/bind/root.hints";
};

logging {
    channel default_log {
        file "/var/log/bind/default.log";
        print-time iso8601-utc;
        severity info;
    };
    channel queries_log {
        file "/var/log/bind/queries.log";
        print-time iso8601-utc;
    };
    channel dnssec_log {
        file "/var/log/bind/dnssec.log";
        print-time iso8601-utc;
        severity dynamic;       // raise at run time with `rndc trace 3`
    };
    category default { default_log; };
    category queries { queries_log; };
    category dnssec { dnssec_log; };
    category resolver { dnssec_log; };
    category lame-servers { dnssec_log; };
};
