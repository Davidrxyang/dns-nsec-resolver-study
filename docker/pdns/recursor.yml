# PowerDNS Recursor 5.4.7 in the local pipeline:
#   client -> pdns (172.30.0.22) -> local root (172.30.0.11) -> responder (172.30.0.10).
# Zones are reached by ordinary delegation from the lab's signed root (FINDINGS INFRA.8),
# not forward_zones: PowerDNS skips its aggressive NSEC cache for forwarded zones (INFRA.7).
incoming:
  listen: [172.30.0.22, 127.0.0.1]
  allow_from: [172.30.0.0/24, 127.0.0.1/32]

outgoing:
  # The default list minus 172.16.0.0/12 (the lab network): iterative queries to
  # the lab root and responder would otherwise be refused. Forwarders were exempt;
  # delegated servers are not. Lab-only (FINDINGS ALL.10, INFRA.8): remove in the wild.
  dont_query: [127.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 169.254.0.0/16, 192.168.0.0/16,
               '::1/128', 'fc00::/7', 'fe80::/10', 0.0.0.0/8, 192.0.0.0/24, 192.0.2.0/24,
               198.51.100.0/24, 203.0.113.0/24, 240.0.0.0/4, '::/96', '::ffff:0:0/96',
               '100::/64', '2001:db8::/32']

dnssec:
  # Deliberate deviation from the default (process, which skips validation for
  # clients without DO/AD): validate every answer, like BIND and Knot.
  validation: validate
  # trustanchors: the lab root's DS, in recursor.d/anchors.yml (docker/pipeline.sh up)

recursor:
  include_dir: /etc/powerdns/recursor.d
  hint_file: /etc/powerdns/root.hints     # the lab root instead of the Internet's
