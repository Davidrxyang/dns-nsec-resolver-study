# PowerDNS Recursor 5.4.7 in the local pipeline: client -> pdns (172.30.0.22) -> responder (172.30.0.10).
# Mirrors docker/bind/named.conf and docker/knot/config.yaml; defaults otherwise.
incoming:
  listen: [172.30.0.22, 127.0.0.1]
  allow_from: [172.30.0.0/24, 127.0.0.1/32]

dnssec:
  # Deliberate deviation from the default (process, which skips validation for
  # clients without DO/AD): validate every answer, like BIND and Knot.
  validation: validate
  # trustanchors: in recursor.d/anchors.yml, generated by docker/pipeline.sh up

recursor:
  include_dir: /etc/powerdns/recursor.d
  # forward_zones sends RD=0 (authoritative-style) and is exempt from dont_query.
  forward_zones:
    - { zone: nsec.test,       forwarders: [172.30.0.10] }
    - { zone: nsec3.test,      forwarders: [172.30.0.10] }
    - { zone: minnsec.test,    forwarders: [172.30.0.10] }
    - { zone: minnsec3.test,   forwarders: [172.30.0.10] }
    - { zone: cdoe-nsec.test,  forwarders: [172.30.0.10] }
    - { zone: cdoe-nsec3.test, forwarders: [172.30.0.10] }
